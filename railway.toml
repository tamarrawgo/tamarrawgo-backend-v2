[build]
builder = "nixpacks"
buildCommand = "npm ci && npm run build --workspace=packages/shared-types && npm run build --workspace=packages/shared-utils && npm run prisma:generate --workspace=backend/api-server && npm run build:backend"

[deploy]
startCommand = "npm run prisma:migrate:prod --workspace=backend/api-server && node backend/api-server/dist/main"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
